server.port=8080
spring.application.name=api-testing-practice

# Visa fullständiga felmeddelanden för enklare API-testning
server.error.include-message=always
server.error.include-binding-errors=always

# Inloggningsuppgifter (för Basic Auth-övningen)
app.auth.username=admin
app.auth.password=hemligt123

# API-nyckel (för API key-övningen)
app.auth.api-key=test-api-key-12345

# JWT (HS256). Secret måste vara minst 32 byte. Endast för övning – byt i prod.
app.jwt.secret=byt-mig-denna-ar-en-lang-dev-only-jwt-hemlighet-1234567890
app.jwt.expiration-ms=3600000

# CORS – tillåt React-devservern
app.cors.allowed-origin=http://localhost:5173

# JSON-formattering
spring.jackson.serialization.indent_output=true
